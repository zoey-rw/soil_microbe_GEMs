version: '3.9'

# To run locally, copy .env.example to .env and fill in POSTGRES_PASSWORD.
# Never commit a real password.

services:
  shiny:
    build: .
    #image: hicsail/comets_shinyapp:master
    container_name: shiny_app
    ports:
      - "3838:3838"
    restart: unless-stopped
  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shiny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-shiny}
    ports:
      - "5432:5432"
    restart: unless-stopped