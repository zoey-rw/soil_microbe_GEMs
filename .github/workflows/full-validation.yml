name: Full-cohort validation

# Manually triggered workflow for the full curated + carvefungi sample
# regression check. Slow (~30 min); not gated on every PR.
on:
  workflow_dispatch:
    inputs:
      carvefungi_sample_size:
        description: 'How many random carvefungi models to validate (0 to skip)'
        default: '50'
        required: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reproduce validation across all curated species
        env:
          PYTHONWARNINGS: ignore
        run: |
          python pipeline/reproduce_validation.py

      - name: Upload reproduction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduction-report
          path: pipeline/reproduction_report.json
