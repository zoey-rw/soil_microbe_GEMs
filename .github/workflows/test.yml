name: Pipeline tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Manual trigger for ad-hoc runs.
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          PYTHONWARNINGS: ignore
        run: |
          pytest -q tests/ --tb=short

      - name: Report xfailed (regression backlog)
        if: always()
        run: |
          pytest tests/ -q --tb=no --no-header -rxX 2>&1 | tail -30 || true
